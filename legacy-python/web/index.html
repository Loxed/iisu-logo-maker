<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iiSU Icon Maker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>iiSU Icon Maker</h1>
      <span id="status">ready</span>
    </header>

    <section class="group" id="source-group">
      <h2>Source</h2>
      <div class="row">
        <label class="file-btn">
          <input type="file" id="file" accept=".svg,image/svg+xml" hidden>
          <span>Select SVG</span>
        </label>
        <select id="source-list" title="loaded sources"></select>
      </div>
      <div class="row">
        <label>Preset</label>
        <select id="preset"></select>
        <button id="apply-preset" class="small">Apply</button>
      </div>
    </section>

    <section class="group" id="controls"></section>

    <section class="group">
      <h2>Output</h2>
      <div class="row">
        <label>Preview size</label>
        <select id="preview-size">
          <option value="480">480</option>
          <option value="640" selected>640</option>
          <option value="800">800</option>
          <option value="1024">1024</option>
        </select>
      </div>
      <div class="row buttons">
        <button id="export" class="primary">Export PNG</button>
        <button id="save-json" class="small">Save preset</button>
        <label class="small file-btn">
          <input type="file" id="load-json" accept=".json" hidden>
          <span>Load preset</span>
        </label>
        <button id="reset" class="small">Reset</button>
      </div>
      <p class="hint" id="cli-hint"></p>
    </section>
  </aside>

  <main id="stage">
    <div class="stage-bar">
      <div class="bg-toggle">
        <button data-bg="checker" class="active">Checker</button>
        <button data-bg="dark">Dark</button>
        <button data-bg="light">Light</button>
      </div>
      <span id="meta"></span>
    </div>
    <div id="viewport" class="checker">
      <img id="preview" alt="preview">
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
